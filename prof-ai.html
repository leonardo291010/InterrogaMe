<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="canonical" href="https://interroga-me.vercel.app/prof-ai.html">

<title>Prof AI - InterrogaMe</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#333;
    color:white;
    padding:20px;
    text-align:center;
}

#chat{
    width:min(900px,95%);
    margin:20px auto;
    background:white;
    border-radius:15px;
    padding:20px;
    height:500px;
    overflow-y:auto;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

.msgUser{
    background:#dff4ff;
    padding:12px;
    border-radius:12px;
    margin:10px 0;
}

.msgAI{
    background:#ececec;
    padding:12px;
    border-radius:12px;
    margin:10px 0;
}

#barra{
    width:min(900px,95%);
    margin:auto;
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

#messaggio{
    flex:1;
    padding:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;

    /* Forziamo la scrittura da sinistra a destra */
    direction:ltr;
    text-align:left;
}

button{
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#333;
    color:white;
}

</style>

</head>

<body>

<header>

<h1>🤖 Prof AI</h1>

<p>Il tuo professore personale.</p>

</header>


<div id="chat">

<div class="msgAI">

Ciao!

Sono il Prof AI.

Scrivimi qualsiasi domanda oppure chiedimi un'interrogazione.

</div>

</div>


<div id="barra">

<input
id="messaggio"
type="text"
dir="ltr"
autocomplete="off"
placeholder="Scrivi qui..."
>

<button onclick="invia()">

Invia

</button>

</div>


<script>

const chat = document.getElementById("chat");


async function invia(){

    const input = document.getElementById("messaggio");

    const testo = input.value;

    if(testo.trim() === "") return;


    /* TEST */

    console.log("TESTO LETTO DAL BROWSER:", testo);

    console.log("CARATTERI:", [...testo]);


    /* Mostra quello che il browser ha letto */

    chat.innerHTML += `

    <div class="msgUser">

        <b>Tu</b><br><br>

        ${testo}

    </div>

    `;


    input.value = "";

    chat.scrollTop = chat.scrollHeight;

}


document
.getElementById("messaggio")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        invia();

    }

});

</script>


</body>

</html>
