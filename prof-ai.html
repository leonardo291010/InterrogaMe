<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="canonical" href="https://interroga-me.vercel.app/prof-ai.html">

<title>Test Prof AI - InterrogaMe</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
    padding:20px;

    direction:ltr !important;
    text-align:left !important;
}

header{
    background:#333;
    color:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
}

#chat{
    width:min(900px,95%);
    margin:20px auto;
    background:white;
    border-radius:15px;
    padding:20px;
    height:500px;
    overflow-y:auto;
    box-shadow:0 0 15px rgba(0,0,0,.1);

    direction:ltr !important;
    text-align:left !important;
    unicode-bidi:plaintext !important;
}

.msgUser{
    background:#dff4ff;
    padding:12px;
    border-radius:12px;
    margin:10px 0;

    direction:ltr !important;
    text-align:left !important;
    unicode-bidi:plaintext !important;
}

.msgAI{
    background:#ececec;
    padding:12px;
    border-radius:12px;
    margin:10px 0;

    direction:ltr !important;
    text-align:left !important;
    unicode-bidi:plaintext !important;
}

#barra{
    width:min(900px,95%);
    margin:auto;
    display:flex;
    gap:10px;
    margin-bottom:20px;
    align-items:flex-start;
}

/* NUOVO CAMPO DI TEST */

#messaggio{
    flex:1;
    box-sizing:border-box;
    padding:15px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:18px;

    direction:ltr !important;
    text-align:left !important;
    unicode-bidi:plaintext !important;

    autocomplete:off;
}

button{
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#333;
    color:white;
}

</style>

</head>


<body>


<header>

<h1>🤖 Prof AI</h1>

<p>Test del campo di scrittura</p>

</header>


<div id="chat">

<div class="msgAI">

Ciao!

Questa è una versione temporanea di test.

L'AI è momentaneamente disattivata.

</div>

</div>


<div id="barra">

<textarea
id="messaggio"
rows="3"
dir="ltr"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false"
placeholder="Scrivi qui..."
></textarea>

<button onclick="invia()">

Invia

</button>

</div>


<script>

const chat = document.getElementById("chat");


function invia(){

    const input = document.getElementById("messaggio");

    const testo = input.value;


    if(testo.trim() === ""){

        return;

    }


    console.log("========== TEST ==========");

    console.log("TESTO LETTO:", testo);

    console.log("CARATTERI:", [...testo]);

    console.log("==========================");


    chat.innerHTML += `

    <div class="msgUser">

        <b>Tu</b><br><br>

        ${testo}

    </div>

    `;


    input.value = "";

    chat.scrollTop = chat.scrollHeight;

}


document
.getElementById("messaggio")
.addEventListener("keydown", function(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        invia();

    }

});

</script>


</body>

</html>
